name: Release installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version to tag, for example 0.1.0
        required: true
        type: string
      installers:
        description: Installer platforms to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - all
permissions: {}
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must be x.y.z.' }
          if (git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG") { throw 'Tag already exists.' }
          "version=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
  test:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: kibertoad/toad-discovery-center/actions/verify-repository@caffbcf5efab3aebf4e58d44ea0b3ae0fca5a225
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/evidence/x86-reporter/requirements.txt
      - name: Verify repository, reporters, build and tests
        shell: pwsh
        run: ./tools/Test.ps1
  windows:
    needs: [prepare, test]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: kibertoad/toad-discovery-center/actions/setup-inno@caffbcf5efab3aebf4e58d44ea0b3ae0fca5a225
      - name: Provision software OpenGL for the platform smoke test
        shell: pwsh
        run: |
          # Hosted runners expose only the GDI generic OpenGL renderer, which has no framebuffer
          # objects, so MonoGame cannot create a graphics device. Mesa's llvmpipe can. If the
          # download fails, the smoke tests run against the runner's own driver and report the
          # graphics failure themselves. Nothing is skipped or masked either way.
          try {
            $driver = ./tools/Install-MesaSoftwareGL.ps1 `
              -DestinationPath (Join-Path $env:RUNNER_TEMP 'software-opengl')
            "PLATFORM_SMOKE_TEST_GL_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Software OpenGL driver provisioned at $driver"
          }
          catch {
            Write-Warning ("Software OpenGL is unavailable, so the platform smoke tests will run " +
              "against the runner's own driver and are expected to fail: $($_.Exception.Message)")
          }
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION -Compiler "$env:INNO_COMPILER"
      - name: Smoke-test installed layout and shortcut
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'restoration-release-install-test'
          $installer = "artifacts/DarkSunWakeRedux-Setup-$env:RELEASE_VERSION.exe"
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOEXTRACT=1',"/DIR=`"$target`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Dark Sun - Wake of the Ravager Redux\Dark Sun - Wake of the Ravager Redux.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target 'Game/DarkSunWakeRedux.Game.exe'))
          if ($link.TargetPath -ne $expectedTarget) { throw "Shortcut target is invalid: '$($link.TargetPath)'." }
          # Same as the CI smoke test: bound the wait and surface the reason. Unbounded, a launch
          # that stops on a dialog nobody can dismiss holds the release job until it times out.
          $smokeOut = Join-Path $env:RUNNER_TEMP 'platform-smoke-stdout.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'platform-smoke-stderr.txt'
          function Write-SmokeDiagnostics {
            foreach ($file in @($smokeOut, $smokeErr)) {
              if ((Test-Path -LiteralPath $file) -and (Get-Item -LiteralPath $file).Length -gt 0) {
                Write-Host "--- $(Split-Path -Leaf $file) ---"
                Get-Content -LiteralPath $file | Write-Host
              }
            }
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'startup-error.log' `
              -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName | Write-Host
              }
          }
          # The flag is accepted only when a driver was provisioned above; the game refuses it
          # otherwise, which is what keeps this mode out of a player's hands.
          $smokeArguments = @('--platform-smoke-test')
          if ($env:PLATFORM_SMOKE_TEST_GL_DRIVER) { $smokeArguments += '--software-renderer' }
          $game = Start-Process $link.TargetPath -ArgumentList $smokeArguments `
            -WorkingDirectory $link.WorkingDirectory -PassThru `
            -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $game.WaitForExit(120000)) {
            Write-SmokeDiagnostics
            $game.Kill($true)
            throw 'Installed platform smoke test did not exit within 120 seconds.'
          }
          # Empty on an ordinary run, and the software-renderer banner otherwise: a passing run
          # prints which renderer it exercised.
          if ((Test-Path -LiteralPath $smokeErr) -and (Get-Item -LiteralPath $smokeErr).Length -gt 0) {
            Get-Content -LiteralPath $smokeErr | Write-Host
          }
          if ($game.ExitCode -ne 0) {
            Write-SmokeDiagnostics
            throw "Installed platform smoke test returned $($game.ExitCode)."
          }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind: $shortcut" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: artifacts/*.exe
          if-no-files-found: error
  linux:
    needs: [prepare, test]
    if: ${{ inputs.installers == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-LinuxInstaller.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: artifacts/*.deb
          if-no-files-found: error
  macos:
    needs: [prepare, test]
    if: ${{ inputs.installers == 'all' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Version $env:RELEASE_VERSION -Runtime $env:TARGET_RUNTIME
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/*.pkg
          if-no-files-found: error
  release:
    needs: [prepare, windows, linux, macos]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.windows.result == 'success' &&
        (inputs.installers == 'windows' ||
          (needs.linux.result == 'success' && needs.macos.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_INSTALLERS: ${{ inputs.installers }}
        run: |
          $assets = @(Get-ChildItem release-assets -File)
          $expected = if ($env:RELEASE_INSTALLERS -eq 'all') { 4 } else { 1 }
          if ($assets.Count -ne $expected) { throw "Expected $expected installer(s); found $($assets.Count)." }
          $commit = git rev-parse HEAD
          $tagObject = gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" -f "tag=$env:RELEASE_TAG" -f "message=Release $env:RELEASE_TAG" -f "object=$commit" -f type=commit --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not create annotated tag object.' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$tagObject"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create tag reference.' }
          gh release create $env:RELEASE_TAG $assets.FullName --verify-tag --generate-notes --title "Dark Sun: Wake of the Ravager Redux $env:RELEASE_TAG"
