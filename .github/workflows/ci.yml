name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-15
          - os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify adopted repository policy
        shell: pwsh
        run: ./tools/Verify-Repository.ps1
      - name: Verify project configuration
        shell: pwsh
        run: ./tools/Verify-Configuration.ps1
      - name: Verify configured template infrastructure
        shell: pwsh
        run: ./tools/Test-TemplateInfrastructure.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./tools/Restore-ToolDependencies.ps1
      - name: Check synthetic evidence tools and pinned upstream snapshots
        run: node --test tests/evidence/evidence.test.mjs tests/upstream/upstream.test.mjs tests/upstream/mapped-locations.test.mjs tests/evidence/bridge.test.mjs tests/evidence/vendor.test.mjs tests/upstream/superseded-ownership.test.mjs tests/upstream/diagnostics.test.mjs tests/upstream/memory-blocks.test.mjs tests/upstream/research-tracking.test.mjs tests/upstream/capture-window.test.mjs tests/upstream/release-signing.test.mjs tests/upstream/infrastructure.test.mjs tests/upstream/export-boundaries.test.mjs
      - run: node tools/Check-ResearchTracking.mjs
      - run: dotnet restore DarkSunWakeRedux.slnx --locked-mode
      - run: dotnet build DarkSunWakeRedux.slnx --no-restore -v minimal
      - run: dotnet test --project tests/DarkSunWakeRedux.Tests/DarkSunWakeRedux.Tests.csproj --no-restore --no-progress -v minimal
      - run: dotnet publish src/DarkSunWakeRedux.Game/DarkSunWakeRedux.Game.csproj --no-restore -c Release --output artifacts/assetless-game -v minimal
      - run: dotnet artifacts/assetless-game/DarkSunWakeRedux.Game.dll --smoke-test
      - name: Prove original content is absent
        shell: pwsh
        run: if (Test-Path artifacts/assetless-game/UserContent) { throw 'Assetless package contains UserContent.' }
  documentation:
    name: Documentation standard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the check can find where a pull request forked from main and fail
          # when it deletes a spec ID, area or deviation that exists there.
          fetch-depth: 0
      # The published checker version matches this pinned toolkit action.
      # A plain 0x address in a code comment is checked only inside the original's image. Once a
      # finding records the image's base and size, add them to this step as `images:` and cite
      # that finding here. `node tools/upstream.mjs docs` reads this step's inputs, so a local
      # run checks the same.
      - uses: kibertoad/refurbished-dinosaurs-toolkit/actions/check-documentation@15ac5eef2fc2e1dcdec24eef7972588c476bf528 # @scientific-method/standard-checker@0.1.0; zizmor: ignore[stale-action-refs]
        with:
          # The narrative docs cite spec IDs, so they must resolve too.
          references: docs
      - name: Check the size limits of the work protocol files
        shell: pwsh
        run: ./tools/Verify-WorkingFiles.ps1
  installer:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: kibertoad/toad-discovery-center/actions/setup-inno@caffbcf5efab3aebf4e58d44ea0b3ae0fca5a225
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
      - name: Provision software OpenGL for the platform smoke test
        shell: pwsh
        run: |
          # Hosted runners expose only the GDI generic OpenGL renderer, which has no framebuffer
          # objects, so MonoGame cannot create a graphics device. Mesa's llvmpipe can. If the
          # download fails, the smoke tests run against the runner's own driver and report the
          # graphics failure themselves. Nothing is skipped or masked either way.
          try {
            $driver = ./tools/Install-MesaSoftwareGL.ps1 `
              -DestinationPath (Join-Path $env:RUNNER_TEMP 'software-opengl')
            "PLATFORM_SMOKE_TEST_GL_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Software OpenGL driver provisioned at $driver"
          }
          catch {
            Write-Warning ("Software OpenGL is unavailable, so the platform smoke tests will run " +
              "against the runner's own driver and are expected to fail: $($_.Exception.Message)")
          }
      - shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -Compiler "$env:INNO_COMPILER"
      - name: Smoke-test installed layout
        shell: pwsh
        run: |
          $project = Get-Content tools/project-config.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem artifacts -Filter '*-Setup-0.1.0.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not produced.' }
          $target = Join-Path $env:RUNNER_TEMP 'restoration-install-test'
          $setup = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOEXTRACT=1',"/DIR=`"$target`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = Join-Path $startMenu "$($project.shortcutName)/$($project.shortcutName).lnk"
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target "Game/$($project.projectName).Game.exe"))
          if ($link.TargetPath -ne $expectedTarget -or [IO.Path]::GetExtension($link.TargetPath) -ne '.exe') {
            throw "Shortcut target is invalid: '$($link.TargetPath)' (expected '$expectedTarget')."
          }
          foreach ($nativeLibrary in @('SDL2.dll', 'openal.dll')) {
            $nativePath = Join-Path (Split-Path -Parent $link.TargetPath) $nativeLibrary
            if (-not (Test-Path -LiteralPath $nativePath)) { throw "Installed native library is missing: $nativePath" }
          }
          # A failed launch explains itself on stderr and in its own startup log; neither reaches
          # the job log on its own, which is how a broken smoke test reads as a bare timeout.
          $smokeOut = Join-Path $env:RUNNER_TEMP 'platform-smoke-stdout.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'platform-smoke-stderr.txt'
          function Write-SmokeDiagnostics {
            foreach ($file in @($smokeOut, $smokeErr)) {
              if ((Test-Path -LiteralPath $file) -and (Get-Item -LiteralPath $file).Length -gt 0) {
                Write-Host "--- $(Split-Path -Leaf $file) ---"
                Get-Content -LiteralPath $file | Write-Host
              }
            }
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'startup-error.log' `
              -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName | Write-Host
              }
          }
          # The flag is accepted only when a driver was provisioned above; the game refuses it
          # otherwise, which is what keeps this mode out of a player's hands.
          $smokeArguments = @('--platform-smoke-test')
          if ($env:PLATFORM_SMOKE_TEST_GL_DRIVER) { $smokeArguments += '--software-renderer' }
          $game = Start-Process $link.TargetPath -ArgumentList $smokeArguments `
            -WorkingDirectory $link.WorkingDirectory -PassThru `
            -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $game.WaitForExit(120000)) {
            Write-SmokeDiagnostics
            $game.Kill($true)
            throw 'Installed platform smoke test did not exit within 120 seconds.'
          }
          # Empty on an ordinary run, and the software-renderer banner otherwise: a passing run
          # prints which renderer it exercised.
          if ((Test-Path -LiteralPath $smokeErr) -and (Get-Item -LiteralPath $smokeErr).Length -gt 0) {
            Get-Content -LiteralPath $smokeErr | Write-Host
          }
          if ($game.ExitCode -ne 0) {
            Write-SmokeDiagnostics
            throw "Installed platform smoke test returned $($game.ExitCode)."
          }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind: $shortcut" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: artifacts/*-Setup-*.exe
          if-no-files-found: error
  installer-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
      - shell: pwsh
        run: ./tools/Build-LinuxInstaller.ps1
      - name: Verify Debian layout
        shell: pwsh
        run: |
          $project = Get-Content tools/project-config.json -Raw | ConvertFrom-Json
          $package = Get-ChildItem artifacts -Filter '*.deb' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'restoration-deb-test'
          dpkg-deb --info $package.FullName
          dpkg-deb --extract $package.FullName $target
          $game = Get-ChildItem $target -Recurse -Filter "$($project.projectName).Game" | Select-Object -First 1
          & $game.FullName --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installer
          path: artifacts/*.deb
          if-no-files-found: error
  installer-macos:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
      - shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Runtime $env:TARGET_RUNTIME
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer-${{ matrix.runtime }}
          path: artifacts/*.pkg
          if-no-files-found: error
